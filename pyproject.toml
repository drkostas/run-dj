[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "run-dj"
version = "0.1.0"
description = "HR → music BPM mapping + session shuffle engine (pure-logic core of Soma's live DJ)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kostas Georgiou" }]
requires-python = ">=3.10"
keywords = ["running", "music", "bpm", "heart-rate", "playlist", "dj", "karvonen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/drkostas/run-dj"
Source = "https://github.com/drkostas/run-dj"
Issues = "https://github.com/drkostas/run-dj/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
